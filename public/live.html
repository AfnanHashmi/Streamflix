<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamflix — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- HLS.js Library for HTTP Live Streaming -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
  :root{
    --stage:#080A10; --stage-2:#0D111A;
    --glass:rgba(255,255,255,0.045); --glass-border:rgba(255,255,255,0.09);
    --blue:#3E7BFA; --gold:#D8AE44;
    --text:#EDEFF4; --text-dim:#7C8291; --live:#E24C5C;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--stage); color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .grotesk{font-family:'Space Grotesk',sans-serif;}
  a{text-decoration:none; color:inherit;}

  .bg-field{ position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(62,123,250,0.12), transparent 60%),
      linear-gradient(var(--stage), var(--stage-2));
  }

  nav{ position:relative; z-index:100; display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; border-bottom:1px solid var(--glass-border);
    background:rgba(8,10,16,0.7); backdrop-filter:blur(20px);
  }
  .logo{ display:flex; align-items:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; letter-spacing:-0.3px;}
  .logo-x{ font-weight:700; font-style:italic; letter-spacing:-2px;
    background:linear-gradient(135deg, var(--blue) 10%, var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; font-size:24px; margin:0 -1px;
    filter:drop-shadow(0 0 14px rgba(62,123,250,0.35));
  }
  .nav-links{ display:flex; gap:26px; list-style:none; }
  .nav-links li{ font-size:13.5px; color:var(--text-dim); cursor:pointer; transition:color .2s; }
  .nav-links li:hover, .nav-links li.active{ color:var(--text); }
  .nav-right{ display:flex; align-items:center; gap:12px; }
  .btn-ghost{ padding:8px 18px; border:1px solid var(--glass-border); border-radius:8px; font-size:13px; color:var(--text); background:rgba(255,255,255,0.02); cursor:pointer;}
  .btn-solid{ padding:8px 20px; border:none; border-radius:8px; font-size:13px; font-weight:600; color:#080A10; background:linear-gradient(135deg, var(--blue), #6FA0FF); cursor:pointer;}

  .layout{
    position:relative; z-index:2; display:grid; grid-template-columns:1fr 340px;
    gap:20px; padding:28px 40px 40px; max-width:1500px; margin:0 auto;
    align-items:start;
  }

  /* PLAYER AREA */
  .player-col{ display:flex; flex-direction:column; gap:16px; }
  .player-frame{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden;
    background:#000; border:1px solid var(--glass-border);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  
  /* VIDEO ELEMENT */
  #videoPlayer {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  /* OFFLINE STATE */
  .offline-state{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 500px 300px at 50% 40%, rgba(62,123,250,0.10), transparent 70%),
      linear-gradient(145deg, #0B0D14, #060709);
    text-align:center; gap:6px; z-index:2;
  }
  .offline-ring{
    width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--glass); border:1px solid var(--glass-border); margin-bottom:22px;
    backdrop-filter:blur(10px);
  }
  .offline-ring svg{ width:30px; height:30px; opacity:0.7; }
  .offline-title{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin-bottom:8px; }
  .offline-sub{ font-size:13.5px; color:var(--text-dim); max-width:320px; line-height:1.6; margin-bottom:22px; }
  .offline-meta{ display:flex; align-items:center; gap:8px; padding:8px 16px; background:var(--glass); border:1px solid var(--glass-border); border-radius:20px; font-size:11.5px; color:var(--text-dim);}
  .offline-meta .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-dim); }

  /* STREAM INFO BAR */
  .stream-info{
    display:flex; align-items:center; justify-content:space-between; padding:18px 20px;
    background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; backdrop-filter:blur(14px);
  }
  .stream-title-block{ display:flex; align-items:center; gap:14px; }
  .stream-avatar{
    width:44px; height:44px; border-radius:10px;
    background:linear-gradient(135deg, var(--blue), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:#080A10;
  }
  .stream-title{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; margin-bottom:2px;}
  .stream-status{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; }
  .status-dot.off{ background:var(--text-dim); }
  .status-dot.on{ background:var(--live); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(226,76,92,.6);} 70%{box-shadow:0 0 0 8px rgba(226,76,92,0);} 100%{box-shadow:0 0 0 0 rgba(226,76,92,0);} }

  .title-edit-btn{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:background .2s;
  }
  .title-edit-btn:hover{ background:rgba(255,255,255,0.08); }
  .title-edit-btn svg{ width:12px; height:12px; opacity:0.75; }
  .title-input{
    font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; color:var(--text);
    background:rgba(255,255,255,0.05); border:1px solid var(--blue); border-radius:6px;
    padding:3px 8px; outline:none; width:220px;
  }
  .stream-title-row{ display:flex; align-items:center; gap:8px; }

  .quality-wrap{ position:relative; }
  .quality-btn{
    display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
    border:1px solid var(--glass-border); background:rgba(255,255,255,0.03);
    color:var(--text); font-size:12.5px; cursor:pointer; transition:background .2s;
  }
  .quality-btn:hover{ background:rgba(255,255,255,0.08); }
  .quality-btn svg{ width:13px; height:13px; opacity:0.7; }
  .quality-menu{
    position:absolute; bottom:calc(100% + 8px); right:0; min-width:160px;
    background:#12151D; border:1px solid var(--glass-border); border-radius:10px;
    padding:6px; display:none; flex-direction:column; gap:2px; z-index:20;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
  }
  .quality-menu.open{ display:flex; }
  .quality-option{
    padding:9px 12px; border-radius:6px; font-size:12.5px; color:var(--text-dim);
    cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    transition:background .15s;
  }
  .quality-option:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  .quality-option.selected{ color:var(--text); }
  .quality-option.selected::after{ content:'✓'; color:var(--blue); }

  /* CHAT PANEL */
  .chat-col{
    display:flex; flex-direction:column; height:calc(100vh - 130px); position:sticky; top:20px;
    background:var(--glass); border:1px solid var(--glass-border); border-radius:16px;
    backdrop-filter:blur(18px); overflow:hidden;
  }
  .chat-head{ padding:16px 18px; border-bottom:1px solid var(--glass-border); display:flex; align-items:center; justify-content:space-between; }
  .chat-head-title{ font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; }
  .chat-count{ font-size:11px; color:var(--text-dim); }
  .chat-messages{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .chat-messages::-webkit-scrollbar{ width:4px; }
  .chat-messages::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:4px; }
  .chat-msg{ display:flex; gap:10px; }
  .chat-msg-avatar{ width:26px; height:26px; border-radius:7px; flex-shrink:0;
    background:linear-gradient(135deg, var(--blue), var(--gold)); opacity:0.8; }
  .chat-msg-body{ font-size:12.5px; line-height:1.5; }
  .chat-msg-user{ font-weight:600; color:var(--text); margin-right:6px; }
  .chat-msg-text{ color:var(--text-dim); }
  .chat-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-dim); text-align:center; padding:20px;}
  .chat-empty svg{ width:32px; height:32px; opacity:0.4; }
  .chat-empty-title{ font-size:13px; font-weight:600; color:var(--text); }
  .chat-empty-sub{ font-size:11.5px; max-width:200px; line-height:1.5; }
  .chat-input-row{ padding:14px; border-top:1px solid var(--glass-border); display:flex; gap:8px; }
  .chat-input{
    flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--glass-border); border-radius:10px;
    padding:10px 14px; color:var(--text); font-size:13px; outline:none;
  }
  .chat-input::placeholder{ color:var(--text-dim); }
  .chat-send{
    width:38px; height:38px; border-radius:10px; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg, var(--blue), #6FA0FF); display:flex; align-items:center; justify-content:center;
  }

  @media (max-width:960px){
    .layout{ grid-template-columns:1fr; }
    .chat-col{ height:460px; position:relative; top:0; }
  }
  @media (max-width:600px){
    nav{ padding:14px 20px; } .nav-links{ display:none; }
    .layout{ padding:20px; }
  }
</style>
</head>
<body>

<div class="bg-field"></div>

<nav>
  <a href="index.html" class="logo">Streamflix<span class="logo-x">X</span></a>
  <ul class="nav-links">
    <li onclick="window.location.href='index.html'">Home</li>
    <li class="active">Live</li>
  </ul>
  <div class="nav-right">
    <button class="btn-ghost" onclick="window.location.href='/login.html'">Log In</button>
    <button class="btn-solid" onclick="window.location.href='/signup.html'">Sign Up</button>
  </div>
</nav>

<div class="layout">

  <div class="player-col">
    <div class="player-frame">
      <!-- Offline overlay -->
      <div class="offline-state" id="offlineState">
        <div class="offline-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="#EDEFF4" stroke-width="1.6"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </div>
        <div class="offline-title grotesk">Stream is offline</div>
        <div class="offline-sub">Nothing's live right now. This page updates automatically the moment broadcasting starts.</div>
        <div class="offline-meta mono"><span class="dot"></span> Waiting for signal</div>
      </div>

      <!-- Live Video Element -->
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="stream-info">
      <div class="stream-title-block">
        <div class="stream-avatar">S</div>
        <div>
          <div class="stream-title-row">
            <div class="stream-title grotesk" id="streamTitle">Live Stream</div>
            <div class="title-edit-btn" id="titleEditBtn" title="Edit title" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            </div>
          </div>
          <div class="stream-status">
            <span class="status-dot off" id="statusDot"></span>
            <span id="statusText">Offline</span>
          </div>
        </div>
      </div>

      <div class="quality-wrap">
        <div class="quality-btn" id="qualityBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21v-7M4 10V3M12 21v-11M12 6V3M20 21v-5M20 12V3"/><circle cx="4" cy="13" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="16" r="2"/></svg>
          <span id="qualityLabel">Auto</span>
        </div>
        <div class="quality-menu" id="qualityMenu">
          <div class="quality-option selected" data-level="-1">Auto</div>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-col">
    <div class="chat-head">
      <div class="chat-head-title grotesk">Live Chat</div>
      <div class="chat-count mono" id="chatCount">0 here</div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty" id="chatEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7C8291" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 20l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        <div class="chat-empty-title grotesk">No one's chatting yet</div>
        <div class="chat-empty-sub">Chat opens up once the stream goes live.</div>
      </div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" placeholder="Chat is disabled while offline" disabled id="chatInput">
      <button class="chat-send" disabled id="chatSend" style="opacity:0.4; cursor:not-allowed;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#080A10" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
  // CHANGE THIS TO YOUR ACTUAL STREAM LINK (.m3u8)
  const STREAM_URL = "https://biggboss24hrs.com/mystream/index.m3u8"
  let hlsInstance = null;
  const video = document.getElementById('videoPlayer');
  const offlineState = document.getElementById('offlineState');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const title = document.getElementById('streamTitle');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const chatEmpty = document.getElementById('chatEmpty');
  const chatMessages = document.getElementById('chatMessages');
  const chatCount = document.getElementById('chatCount');

  function initPlayer() {
    if (Hls.isSupported()) {
      if (hlsInstance) hlsInstance.destroy();

      hlsInstance = new Hls({
        manifestLoadingTimeOut: 5000,
        manifestLoadingMaxRetry: 2
      });

      hlsInstance.loadSource(STREAM_URL);
      hlsInstance.attachMedia(video);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
        setLiveUI();
        video.play().catch(() => {});
        buildQualityMenu(data.levels);
      });

      hlsInstance.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          setOfflineUI();
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Native Safari support
      video.src = STREAM_URL;
      video.addEventListener('loadedmetadata', function () {
        setLiveUI();
        video.play();
      });
      video.addEventListener('error', function () {
        setOfflineUI();
      });
    }
  }

  function setLiveUI() {
    offlineState.style.display = 'none';
    video.style.display = 'block';
    dot.className = 'status-dot on';
    statusText.textContent = 'Live now';
    // Title now comes from the server (loadStreamTitle) — don't overwrite it here
    
    chatInput.disabled = false;
    chatInput.placeholder = 'Say something...';
    chatSend.disabled = false;
    chatSend.style.opacity = 1;
    chatSend.style.cursor = 'pointer';
    
    if (chatEmpty) chatEmpty.style.display = 'none';
    chatCount.textContent = 'Live';
  }

  function setOfflineUI() {
    offlineState.style.display = 'flex';
    video.style.display = 'none';
    dot.className = 'status-dot off';
    statusText.textContent = 'Offline';
    // Title now comes from the server (loadStreamTitle) — don't overwrite it here
    
    chatInput.disabled = true;
    chatInput.placeholder = 'Chat is disabled while offline';
    chatSend.disabled = true;
    chatSend.style.opacity = 0.4;
    chatSend.style.cursor = 'not-allowed';
    
    if (chatEmpty) chatEmpty.style.display = 'flex';
    chatCount.textContent = '0 here';
  }

  // Poll the stream link when offline to auto-reconnect when stream begins
  setInterval(() => {
    if (video.style.display === 'none' || video.style.display === '') {
      fetch(STREAM_URL, { method: 'HEAD' })
        .then(response => {
          if (response.ok) {
            initPlayer();
          }
        })
        .catch(() => {});
    }
  }, 8000);

  // Chat input listener
  chatInput.addEventListener('keypress', function(e) {
    if(e.key === 'Enter' && this.value.trim()) {
      addMsg('You', this.value.trim());
      this.value = '';
    }
  });

  function addMsg(user, text) {
    const el = document.createElement('div');
    el.className = 'chat-msg';
    el.innerHTML = `<div class="chat-msg-avatar"></div><div class="chat-msg-body"><span class="chat-msg-user">${user}</span><span class="chat-msg-text">${text}</span></div>`;
    chatMessages.appendChild(el);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // ===== QUALITY SELECTOR =====
  const qualityBtn = document.getElementById('qualityBtn');
  const qualityMenu = document.getElementById('qualityMenu');
  const qualityLabel = document.getElementById('qualityLabel');

  qualityBtn.addEventListener('click', () => {
    qualityMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!qualityBtn.contains(e.target) && !qualityMenu.contains(e.target)) {
      qualityMenu.classList.remove('open');
    }
  });

  // Builds the menu from whatever renditions are actually present in the manifest.
  // If OBS is only sending one quality, this will just show "Auto" — real quality
  // options require server-side multi-bitrate transcoding (see notes).
  function buildQualityMenu(levels) {
    qualityMenu.innerHTML = `<div class="quality-option selected" data-level="-1">Auto</div>`;
    if (!levels || levels.length <= 1) return; // nothing to switch between yet

    levels.forEach((level, index) => {
      const label = level.height ? `${level.height}p` : `${Math.round(level.bitrate/1000)}kbps`;
      const opt = document.createElement('div');
      opt.className = 'quality-option';
      opt.dataset.level = index;
      opt.textContent = label;
      qualityMenu.appendChild(opt);
    });
  }

  qualityMenu.addEventListener('click', (e) => {
    const opt = e.target.closest('.quality-option');
    if (!opt || !hlsInstance) return;
    const levelIndex = parseInt(opt.dataset.level, 10);
    hlsInstance.currentLevel = levelIndex; // -1 = auto (hls.js adaptive)
    qualityLabel.textContent = opt.textContent;
    qualityMenu.querySelectorAll('.quality-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    qualityMenu.classList.remove('open');
  });

  // ===== ADMIN ACCESS CONTROL (real server-checked session) =====
  const titleEditBtn = document.getElementById('titleEditBtn');

  async function checkAdminAccess() {
    try {
      const res = await fetch('/api/me', { credentials: 'include' });
      if (!res.ok) return; // not logged in — edit button stays hidden
      const data = await res.json();
      if (data.isAdmin) titleEditBtn.style.display = 'flex';
    } catch {
      // not logged in / server unreachable — edit button stays hidden either way
    }
  }
  checkAdminAccess();

  // Load the current title from the server so ALL viewers see the same one
  // (not just whoever's browser last set it via localStorage)
  async function loadStreamTitle() {
    try {
      const res = await fetch('/api/stream-title');
      const data = await res.json();
      if (data.title) title.textContent = data.title;
    } catch {}
  }
  loadStreamTitle();

  // ===== EDITABLE TITLE =====
  titleEditBtn.addEventListener('click', () => {
    const current = title.textContent;
    const input = document.createElement('input');
    input.className = 'title-input';
    input.value = current;
    title.replaceWith(input);
    input.focus();
    input.select();

    async function commit() {
      const newTitle = input.value.trim() || current;
      try {
        const res = await fetch('/api/stream-title', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ title: newTitle })
        });
        if (!res.ok) throw new Error('Failed to save — you may need to log in again');
        const data = await res.json();
        title.textContent = data.title;
      } catch (err) {
        alert(err.message);
        title.textContent = current;
      }
      input.replaceWith(title);
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { title.textContent = current; input.replaceWith(title); }
    });
    input.addEventListener('blur', commit);
  });

  // Start initialization
  window.addEventListener('DOMContentLoaded', initPlayer);
</script>

</body>
</html>
